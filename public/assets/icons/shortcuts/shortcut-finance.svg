</defs>
<!-- Fondo Squircle Neumórfico -->
<rect x="6" y="6" width="84" height="84" rx="24" fill="url(#bucaIconBg)" stroke="url(#bucaIconGrad)" stroke-width="2.5" filter="url(#iconGlow)"/>
