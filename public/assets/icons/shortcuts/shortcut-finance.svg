	<path d="M 58 62 A 16 16 0 0 1 34 58" />
	<polyline points="36 66 33 58 41 56" fill="url(#bucaIconGrad)" stroke-width="1.5" />
	<!-- Símbolo dólar central -->
	<path d="M 48 39 L 48 57" stroke="#ffffff" stroke-width="2.5" />
	<path d="M 52 43 C 52 41 45 40 45 45 C 45 50 51 47 51 52 C 51 56 44 55 44 53" stroke="#ffffff" stroke-width="2.5" />

