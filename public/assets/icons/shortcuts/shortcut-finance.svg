<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" id="shortcut-finance" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" xml:space="preserve">
<defs>
	<linearGradient id="bucaIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
		<stop offset="0%" stop-color="#38bdf8"/>
		<stop offset="50%" stop-color="#2563eb"/>
		<stop offset="100%" stop-color="#7c3aed"/>
	</linearGradient>
	<linearGradient id="bucaIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
		<stop offset="0%" stop-color="#0f172a"/>
		<stop offset="100%" stop-color="#1e1b4b"/>
	</linearGradient>
	<filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
		<feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.35"/>
