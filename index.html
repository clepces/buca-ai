<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BUCA AI - Corporate Hybrid Glass</title>
    <meta name="description" content="Ecosistema inteligente ERP con diseño Glassmorphism y motor neuronal.">

    <!-- 1. IDENTIDAD CORPORATIVA, PWA MANIFEST & TIPOGRAFÍA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563eb">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BUCA AI">
    <link rel="apple-touch-icon" href="/assets/icons/android/android-launchericon-192-192.png">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/logo-light.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- 2. NÚCLEO PRE-RENDER: ESTADO Y PREFERENCIAS -->
    <script>
        (function () {
            try {
                // Sincronización inmediata de tema y rendimiento para evitar FOUC
                const theme = localStorage.getItem('buca-theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);

                const perfData = JSON.parse(localStorage.getItem('buca_performance_config') || '{"profile":"balanced","isManualMode":false}');
                const tiers = { 'eco': 'L0', 'balanced': 'L1', 'pro': 'L2', 'ultra': 'L3' };
                document.documentElement.setAttribute('data-buca-perf', tiers[perfData.profile] || 'L1');
                document.documentElement.setAttribute('data-buca-manual', perfData.isManualMode ? 'true' : 'false');

                // Registro de actividad para el watchdog
                window.__bucaLastActivity = Date.now();
                window.bucaNotifyActivity = function () { window.__bucaLastActivity = Date.now(); };
            } catch (e) {
                console.warn('[Pre-init] Error cargando preferencias:', e);
            }
        })();
    </script>

    <!-- 2.1. CSS CRÍTICO DE ARRANQUE (PRELOADER INICIAL SIN FOUC) -->
    <style id="buca-critical-preloader-css">
        #global-preloader {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }

        html[data-theme="dark"] #global-preloader {
            background: #0f172a;
            color: #ffffff;
        }

        .buca-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(37, 99, 235, 0.15);
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: buca-spin 0.8s linear infinite;
            margin-bottom: 20px;
            will-change: transform;
        }

        @keyframes buca-spin {
            to {
                transform: rotate(360deg);
            }
        }

        .buca-text {
            color: #2563eb;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        html[data-theme="dark"] .buca-text {
            color: #ffffff;
        }

        .buca-sub {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 8px;
            letter-spacing: 0.5px;
            max-width: 320px;
            line-height: 1.4;
        }

        html[data-theme="dark"] .buca-sub {
            color: #94a3b8;
        }

        .splash-progress-wrapper {
            width: 180px;
            max-width: 80vw;
            height: 4px;
            background: rgba(37, 99, 235, 0.12);
            border-radius: 99px;
            overflow: hidden;
            margin: 16px 0;
        }

        #splash-progress {
            width: var(--buca-progress, 0%);
            height: 100%;
            background: #2563eb;
            transition: width 0.3s ease;
        }

        #splash-percentage {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0;
        }

        /* Estados de Alerta / Advertencia del Preloader (Watchdog 503 / Error) */
        #global-preloader.preloader--503,
        #global-preloader.is-warning,
        #global-preloader.preloader--error,
        #global-preloader.is-error {
            background: linear-gradient(135deg, rgba(255, 247, 237, 0.95) 0%, rgba(254, 215, 170, 0.95) 100%) !important;
        }

        html[data-theme="dark"] #global-preloader.preloader--503,
        html[data-theme="dark"] #global-preloader.is-warning,
        html[data-theme="dark"] #global-preloader.is-error {
            background: linear-gradient(135deg, rgba(69, 10, 10, 0.96) 0%, rgba(24, 4, 4, 0.96) 100%) !important;
        }

        #global-preloader.preloader--503 .buca-text,
        #global-preloader.is-warning .buca-text {
            color: #ea580c !important;
        }

        html[data-theme="dark"] #global-preloader.preloader--503 .buca-text,
        html[data-theme="dark"] #global-preloader.is-warning .buca-text {
            color: #fb923c !important;
        }

        #global-preloader.preloader--503 #splash-status,
        #global-preloader.is-warning #splash-status {
            color: #9a3412 !important;
            font-weight: 600;
            opacity: 1 !important;
            background: rgba(234, 88, 12, 0.12);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(234, 88, 12, 0.25);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.15);
            cursor: pointer;
        }

        html[data-theme="dark"] #global-preloader.preloader--503 #splash-status,
        html[data-theme="dark"] #global-preloader.is-warning #splash-status {
            color: #fdba74 !important;
            background: rgba(251, 146, 60, 0.15);
            border-color: rgba(251, 146, 60, 0.3);
        }

        #global-preloader.preloader--503 .splash-progress-wrapper,
        #global-preloader.preloader--503 #splash-percentage,
        #global-preloader.is-warning .splash-progress-wrapper,
        #global-preloader.is-warning #splash-percentage {
            display: none !important;
        }
    </style>
</head>

<body class="glass-theme">
    <!-- 3. CAPA DE ARRANQUE (SPLASH SCREEN) -->
    <div id="global-preloader">
        <div class="buca-spinner"></div>
        <div class="buca-text">BUCA</div>
        <div class="splash-progress-wrapper">

        </div>
        <div id="splash-percentage" class="buca-sub">0%</div>
        <div id="splash-status" class="buca-sub buca-sub--low-opacity">Iniciando Kernel Neuronal...</div>
    </div>

    <!-- 4. CONTENEDOR RAÍZ SPA -->
    <div id="app"></div>

                            title="Más opciones (IA, Ayuda, Tamaño)">

                        <button type="button" class="ui-modal__close-btn" id="ui-modal-btn-close"

                        </button>
                    </div>
                </div>
            </header>
            <div class="ui-modal__body" id="ui-modal-body" data-loading="false">
                <div class="ui-modal__skeleton" id="ui-modal-skeleton" aria-hidden="true" hidden>
                </div>
                <aside class="ui-modal__nav" id="ui-modal-nav" data-nav-position="left" data-nav-collapsed="false"
                    hidden>
                </aside>
                <main class="ui-modal__content" id="ui-modal-content">
                </main>
            </div>
            <footer class="ui-modal__footer" id="ui-modal-footer" data-footer-scope="view">
                <div class="ui-modal__footer-left" id="ui-modal-footer-left"></div>
                <div class="ui-modal__footer-center" id="ui-modal-footer-center"></div>

            </footer>
        </section>
    </div>

    <!-- 5. SISTEMA DE VIGILANCIA Y GESTIÓN DE ERRORES (WATCHDOG) -->
    <script>
        (function () {
            window.onerror = function (msg, url, line, col) {
                const splash = document.getElementById('global-preloader');
                if (splash && !document.body.classList.contains('app-ready')) {
                    splash.classList.add('preloader--error', 'is-error');
                    const status = document.getElementById('splash-status');
                    if (status) status.textContent = "Error de Kernel: " + (msg || "Anomalía de arranque");
                    splash.style.cursor = "pointer";
                    splash.onclick = function () { location.reload(); };
                }
                try {
                    localStorage.setItem('buca_watchdog_last_error', JSON.stringify({
                        msg: String(msg), url: String(url), line, col, time: Date.now()
                    }));
                } catch {
                    // Silencioso en caso de bloqueo de storage
                }
                return false;
            };

            // Watchdog de carga adaptativo según velocidad de red (evita falsos 503 y recargas accidentales en 2G/3G)
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const isSlowNet = Boolean(conn && (conn.saveData || ['slow-2g', '2g', '3g'].includes(conn.effectiveType)));
            const initialDelay = isSlowNet ? 15000 : 10000;
            const stepDelay = isSlowNet ? 10000 : 6000;
            const maxAttempts = isSlowNet ? 5 : 3;

            let attempts = 0;
            const check = () => {
                if (document.body.classList.contains('app-ready')) return;
                attempts++;
                const status = document.getElementById('splash-status');
                if (attempts > maxAttempts) {
                    const splash = document.getElementById('global-preloader');
                    if (splash) {
                        splash.classList.add('preloader--503', 'is-warning');
                        if (status && !document.getElementById('buca-watchdog-retry')) {
                            status.textContent = 'La carga está tardando más de lo normal. ';
                            const retryBtn = document.createElement('button');
                            retryBtn.type = 'button';
                            retryBtn.id = 'buca-watchdog-retry';
                            retryBtn.className = 'btn btn-sm btn-warning ms-2 fw-semibold';
                            retryBtn.textContent = 'Reintentar';
                            retryBtn.addEventListener('click', () => location.reload());
                            status.appendChild(retryBtn);
                        }
                    }
                } else {
                    if (attempts >= 2 && status && !status.dataset.slowNotified) {
                        status.dataset.slowNotified = 'true';
                        status.textContent = isSlowNet
                            ? 'Conexión lenta detectada, cargando recursos...'
                            : 'Finalizando carga de recursos...';
                    }
                    setTimeout(check, stepDelay);
                }
            };
            setTimeout(check, initialDelay);
        })();
    </script>

    <!-- 6. PUNTO DE ENTRADA PRINCIPAL -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
