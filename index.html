    <!-- 1. IDENTIDAD CORPORATIVA, PWA MANIFEST & TIPOGRAFÍA -->

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">

    <!-- 2. NÚCLEO PRE-RENDER: ESTADO Y PREFERENCIAS -->
    <script>
        (function () {
            try {
                // Sincronización inmediata de tema y rendimiento para evitar FOUC
                const theme = localStorage.getItem('buca-theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);

                const perfData = JSON.parse(localStorage.getItem('buca_performance_config') || '{"profile":"balanced","isManualMode":false}');
                const tiers = { 'eco': 'L0', 'balanced': 'L1', 'pro': 'L2', 'ultra': 'L3' };
                const resolvedTier = tiers[perfData.profile] || 'L1';
                document.documentElement.setAttribute('bene-perf', resolvedTier);
                document.documentElement.setAttribute('data-buca-perf', resolvedTier);
                document.documentElement.setAttribute('data-buca-manual', perfData.isManualMode ? 'true' : 'false');
            } catch (e) {
                console.warn('[Pre-init] Error cargando preferencias:', e);
            }
        })();
    </script>

    <!-- 2.1. CSS CRÍTICO DE ARRANQUE (CSS BASE SÓLIDO SIN FOUC NI GLASS) -->
    <style id="buca-critical-preloader-css">
        #global-preloader {
            --preloader-bg: #f8fafc;
            --preloader-text: #0f172a;
            --preloader-muted: #64748b;
            --preloader-accent: #2563eb;
            --preloader-track: rgba(37, 99, 235, 0.14);
            --preloader-badge-bg: rgba(37, 99, 235, 0.08);
            --preloader-badge-border: rgba(37, 99, 235, 0.22);
            --preloader-badge-text: #1d4ed8;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background: var(--preloader-bg);
            color: var(--preloader-text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
        }

        html[data-theme="dark"] #global-preloader {
            --preloader-bg: #0f172a;
            --preloader-text: #f8fafc;
            --preloader-muted: #94a3b8;
            --preloader-track: rgba(96, 165, 250, 0.16);
            --preloader-badge-bg: rgba(59, 130, 246, 0.14);
            --preloader-badge-border: rgba(96, 165, 250, 0.28);
            --preloader-badge-text: #93c5fd;
        }

        .buca-brand-loader {
            width: 58px;
            height: 58px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buca-brand-loader svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .buca-brand-loader__track {
            fill: none;
            stroke: var(--preloader-track);
            stroke-width: 24;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .buca-brand-loader__stroke {
            fill: none;
            stroke: url(#bucaPreloaderGrad);
            stroke-width: 26;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 32 68;
            stroke-dashoffset: 100;
            animation: buca-logo-trace 1.65s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }

        @keyframes buca-logo-trace {
            0% {
                stroke-dashoffset: 100;
            }
            100% {
                stroke-dashoffset: 0;
            }
        }

        .buca-text {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--preloader-accent);
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        html[data-theme="dark"] .buca-text {
            color: #ffffff;
        }

        .buca-brand-ai {
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--preloader-badge-bg);
            color: var(--preloader-badge-text);
            border: 1px solid var(--preloader-badge-border);
            font-weight: 700;
        }

        .splash-progress-wrapper {
            width: 220px;
            max-width: 80vw;
            height: 4px;
            background: var(--preloader-track);
            border-radius: 99px;
            overflow: hidden;
            margin: 16px 0 10px;
        }

        #splash-progress {
            width: var(--buca-progress, 0%);
            height: 100%;
            background: var(--preloader-accent);
            border-radius: 99px;
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.35s ease;
        }

        #splash-percentage {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--preloader-muted);
            font-variant-numeric: tabular-nums;
            margin-bottom: 12px;
        }

        .splash-status-viewport {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: min(92vw, 520px);
            min-height: 76px;
            overflow: hidden;
            padding: 4px 0;
        }

        .splash-status-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.85rem;
            will-change: transform, opacity;
        }

        .splash-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 11px;
            border-radius: 999px;
            background: var(--preloader-badge-bg);
            border: 1px solid var(--preloader-badge-border);
            color: var(--preloader-badge-text);
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .splash-badge-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 13px;
            height: 13px;
            flex-shrink: 0;
        }

        .splash-badge-icon svg {
            width: 13px;
            height: 13px;
            display: block;
        }

        .splash-status-text-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--preloader-muted);
            line-height: 1.45;
            min-height: 22px;
            max-width: 100%;
            text-align: center;
        }

        #splash-status-text {
            display: inline-block;
            will-change: transform, opacity;
        }

        .splash-actions {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 2px;
        }

        .splash-actions:empty {
            display: none;
        }

        .splash-action-btn {
            appearance: none;
            border: 1px solid var(--preloader-badge-border);
            background: var(--preloader-accent);
            color: #ffffff;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }

        .splash-action-btn:hover {
            opacity: 0.92;
        }

        .splash-action-btn--secondary {
            background: transparent;
            color: var(--preloader-badge-text);
        }

        #global-preloader.preloader--500 .buca-brand-loader__stroke,
        #global-preloader.preloader--503 .buca-brand-loader__stroke,

</head>

    <!-- 5. SISTEMA DE VIGILANCIA Y GESTIÓN DE ERRORES (WATCHDOG) -->
    <script>
        (function () {
            let watchdogTimer = null;
            let isDisposed = false;

            const setPreloaderAlert = (stateClass, icon, title, message, showRetry = true) => {
                const splash = document.getElementById('global-preloader');
                if (!splash || document.body.classList.contains('app-ready')) return;

                splash.classList.remove(
                    'preloader--boot', 'preloader--engine', 'preloader--database',
                    'preloader--auth', 'preloader--layout', 'preloader--modules',
                    'preloader--router', 'preloader--ready', 'preloader--success',
                    'preloader--info', 'preloader--warning', 'preloader--offline',
                    'preloader--error', 'preloader--401', 'preloader--403',
                    'preloader--404', 'preloader--500', 'preloader--503',
                    'is-error', 'is-warning'
                );
                splash.classList.add(stateClass);

                const iconEl = document.getElementById('splash-badge-icon');
                const titleEl = document.getElementById('splash-badge-title');
                const textEl = document.getElementById('splash-status-text');
                const actionsEl = document.getElementById('splash-actions');

                if (iconEl) {
                    const icons = {
                        'preloader--offline': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 13a10 10 0 0 1 5.17-2.69"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>',
                        'preloader--503': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
                    };
                    iconEl.innerHTML = icons[stateClass] || '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
                }
                if (titleEl) titleEl.textContent = title;
                if (textEl) textEl.textContent = message;

                if (actionsEl) {
                    actionsEl.replaceChildren();
                    if (showRetry) {
                        const retryBtn = document.createElement('button');
                        retryBtn.type = 'button';
                        retryBtn.id = 'buca-watchdog-retry';
                        retryBtn.className = 'splash-action-btn';
                        retryBtn.textContent = 'Reintentar';
                        retryBtn.addEventListener('click', () => location.reload(), { once: true });
                        actionsEl.appendChild(retryBtn);
                    }
                }
            };

            const onBootError = (event) => {
                if (isDisposed || document.body.classList.contains('app-ready')) return;
                if (event?.filename && !event.filename.startsWith(location.origin)) return;
                const msg = event?.message || 'Anomalía de arranque';
                setPreloaderAlert('preloader--error', '🚨', 'Error de Kernel', String(msg), true);
                try {
                    localStorage.setItem('buca_watchdog_last_error', JSON.stringify({
                        msg: String(msg),
                        url: String(event?.filename || ''),
                        line: event?.lineno || 0,
                        col: event?.colno || 0,
                        time: Date.now()
                    }));
                } catch {
                    // Silencioso en caso de bloqueo de storage
                }
            };

            const stopWatchdog = () => {
                isDisposed = true;
                if (watchdogTimer) {
                    clearTimeout(watchdogTimer);
                    watchdogTimer = null;
                }
                window.removeEventListener('error', onBootError);
            };

            document.addEventListener('buca:app-ready', stopWatchdog, { once: true });
            window.addEventListener('error', onBootError);

            if (navigator.onLine === false) {
                setPreloaderAlert('preloader--offline', '📡', 'Sin conexión', 'Verifica tu red para conectar con BUCA AI.', true);
                return;
            }

            // Watchdog de carga adaptativo según velocidad de red
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const isSlowNet = Boolean(conn && (conn.saveData || ['slow-2g', '2g', '3g'].includes(conn.effectiveType)));
            const initialDelay = isSlowNet ? 15000 : 10000;
            const stepDelay = isSlowNet ? 10000 : 6000;
            const maxAttempts = isSlowNet ? 5 : 3;

            let attempts = 0;
            const check = () => {
                if (isDisposed || document.body.classList.contains('app-ready')) {
                    stopWatchdog();
                    return;
                }
                attempts++;
                if (attempts > maxAttempts) {
                    setPreloaderAlert('preloader--503', '🔌', 'Tiempo excedido', 'La carga está tardando más de lo normal.', true);
                    stopWatchdog();
                } else {
                    if (attempts >= 2) {
                        const textEl = document.getElementById('splash-status-text');
                        if (textEl && !textEl.dataset.slowNotified) {
                            textEl.dataset.slowNotified = 'true';
                            textEl.textContent = isSlowNet
                                ? 'Conexión lenta detectada, cargando recursos...'
                                : 'Finalizando carga de recursos...';
                        }
                    }
                    watchdogTimer = setTimeout(check, stepDelay);
                }
            };
            watchdogTimer = setTimeout(check, initialDelay);
        })();
    </script>
