name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-firebase-hosting-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Production Hosting
    runs-on: ubuntu-latest
    if: github.repository == 'clepces/buca-ai'
    environment:
      name: production
      url: https://buca-webapp.web.app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Clean Dependencies
        run: npm ci

      - name: Validate Tests Before Deployment
        run: npm test

      - name: Production Build (Vite)
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://rdvezglzxjjcfbodpfzo.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkdmV6Z2x6eGpqY2Zib2RwZnpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNjQxMTYsImV4cCI6MjEwOTg0MDExNn0.t9AS029XtzB5qQTBEi5hRhqvUs02gUcftzCdWes3RsA' }}
          VITE_DOLAR_VZLA_KEY: ${{ secrets.VITE_DOLAR_VZLA_KEY || '1943db913d1267586395dcc855969e4ebcf32ded3b3a3ed150a01a1a7ab02236' }}
          VITE_DOLAR_VZLA_CDN: 'https://rates.dolarvzla.com'
          VITE_DOLAR_VZLA_API: 'https://api.dolarvzla.com'

      - name: Verify Distribution Directory
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "::error::Directorio de distribución 'dist' no encontrado o inválido."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUCA_SCDBS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: buca-scdbs
          target: buca-webapp
