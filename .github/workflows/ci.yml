name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Clean Dependencies
        run: npm ci

      - name: Run Linters (ESLint & Stylelint)
        run: npm run lint

      - name: Run Type-Check (TypeScript)
        run: npm run type-check

      - name: Run Unit Tests (In-Memory Isolation)
        run: npm test

      - name: Production Build (Vite)
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: "https://rdvezglzxjjcfbodpfzo.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key_for_ci_build"

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7
